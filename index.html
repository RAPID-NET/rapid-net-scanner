<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RAPID-NET QR Scanner</title>
  <script src="libs/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    #header {
      background-color: #166534;
      color: white;
      padding: 10px 16px;
    }
    
    .scanner-school-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: left;
    }
    
    .scanner-logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
      background: white;
      border-radius: 50%;
      padding: 4px;
    }
    
    .scanner-school-name {
      font-weight: bold;
      font-size: 18px;
    }
    
    .scanner-school-address {
      font-size: 13px;
      opacity: 0.95;
    }
    
    .scanner-title {
      margin-top: 2px;
      font-size: 24px;
      font-weight: bold;
    }
    #controls { padding: 10px; text-align: center; }
    #reader { width: 300px; margin: 15px auto; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
    #status { text-align: center; font-weight: bold; margin-top: 10px; }
    #manual-entry { margin-top: 15px; text-align: center; }
    #manual-entry input { padding: 5px; width: 150px; font-size: 16px; }
    #manual-entry button { padding: 6px 12px; font-size: 16px; margin-left: 5px; }
    table { border-collapse: collapse; width: 90%; margin: 15px auto; background: white; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    tr:nth-child(even) { background: #f9f9f9; }
    #switchCameraBtn {
  padding: 8px 14px;
  font-size: 15px;
  font-weight: bold;
  border-radius: 6px;
  background: #166534;
  color: white;
  border: none;
}
    /* ✅ Success Popup */
    #popup {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #4CAF50;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      display: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      animation: fadeInOut 2.5s ease-in-out;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, 20px); }
      10% { opacity: 1; transform: translate(-50%, 0); }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, 20px); }
    }
  </style>
</head>
<body>

  <div id="header">
  <div class="scanner-school-header">
    <img
      src="https://drive.google.com/thumbnail?id=1nK6f-i5iFasipRW4EkSGGjU-Wb80LwAH&sz=w200"
      alt="School Logo"
      class="scanner-logo"
    >

    <div>
      <div class="scanner-school-name">TINAJEROS NATIONAL HIGH SCHOOL</div>
      <div class="scanner-school-address">B. Rivera St. Tinajeros, Malabon City</div>
      <div class="scanner-title">RAPID-NET QR SCANNER</div>
    </div>
  </div>
</div>

  <div id="controls">
  <div>
    <label><input type="radio" name="scanType" value="in" checked> IN</label>
    <label><input type="radio" name="scanType" value="out"> OUT</label>
  </div>

  <div style="margin-top:8px;">
  <label><input type="radio" name="session" value="AM" checked> AM Session</label>
  <label><input type="radio" name="session" value="PM"> PM Session</label>
</div>
  <div style="margin-top:8px;">
  <label>
    <input type="checkbox" id="schoolWideEarlyDismissal">
    School-wide Early Dismissal
  </label>
</div>
<div style="margin-top:10px;">
  <button id="switchCameraBtn" type="button">Switch Camera</button>
  <br><br>
  <button id="enableSoundBtn" type="button">Enable Sound</button>
</div>
</div>

  <div id="reader"></div>
  <p id="status">📷 Waiting for scan...</p>

  <div id="manual-entry">
    <input type="text" id="manualId" placeholder="Enter Student ID">
    <button id="manualBtn">Submit Manual Entry</button>
  </div>

  <table id="logTable">
  <thead>
    <tr>
      <th>Student Name</th>
      <th>Grade</th>
      <th>Section</th>
      <th>Direction</th>
      <th>Status</th>
      <th>Reason</th>
      <th>Time</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

  <div id="popup">✅ Scan Recorded Successfully</div>

<script>
  const scriptURL = "https://script.google.com/macros/s/AKfycby2FqR8AiFZj-NKn065GqBLVhV5Ta1h9T4GAcEljgRbafPj9C2NNMkGmei0GCQxlFQN/exec";

  let html5QrCode;
  let scanning = false;
  let scanBusy = false;

  let lastScanned = "";
  let lastScanKey = "";
  let lastScanTime = 0;

  let cameras = [];
  let currentCameraIndex = 0;

  let cachedLat = "";
  let cachedLng = "";

  function getScanType() {
    return document.querySelector('input[name="scanType"]:checked').value;
  }
  
  function getSession() {
    return document.querySelector('input[name="session"]:checked').value;
  }

  function isSchoolWideEarlyDismissal() {
  const checkbox = document.getElementById("schoolWideEarlyDismissal");
  return checkbox && checkbox.checked;
}
    function getEarlyOutReasonIfNeeded() {
  const scanType = getScanType();
  if (scanType !== "out") return "";

  const session = getSession();
  const now = new Date();
  const minutesNow = now.getHours() * 60 + now.getMinutes();

  const amDismissal = 12 * 60 + 10; // 12:10 PM
  const pmDismissal = 18 * 60 + 40; // 6:40 PM

  const isEarlyOut =
    (session === "AM" && minutesNow < amDismissal) ||
    (session === "PM" && minutesNow < pmDismissal);

  if (!isEarlyOut) return "";
      
  if (isSchoolWideEarlyDismissal()) {
  return "School-wide early dismissal";
}

  const choice = prompt(
    "Select Early OUT reason:\n\n" +
    "1 - Clinic / Health concern\n" +
    "2 - Parent picked up\n" +
    "3 - Official school activity\n" +
    "4 - Family emergency\n" +
    "5 - Guidance / Office concern\n" +
    "6 - Unauthorized exit\n" +
    "7 - Others\n\n" +
    "Type number only:"
  );

  if (!choice || !choice.trim()) return null;

  const reasons = {
    "1": "Clinic / Health concern",
    "2": "Parent picked up",
    "3": "Official school activity",
    "4": "Family emergency",
    "5": "Guidance / Office concern",
    "6": "Unauthorized exit"
  };

  const selected = choice.trim();

  if (selected === "7") {
    const otherReason = prompt("Please type specific reason:");

    if (!otherReason || !otherReason.trim()) return null;

    return "Others - " + otherReason.trim();
  }

  if (!reasons[selected]) {
    alert("Invalid choice. Early OUT scan cancelled.");
    return null;
  }

  return reasons[selected];
}
  let soundEnabled = false;
let sharedAudioCtx = null;

function enableSound() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    sharedAudioCtx = sharedAudioCtx || new AudioContext();

    if (sharedAudioCtx.state === "suspended") {
      sharedAudioCtx.resume();
    }

    soundEnabled = true;
    playBeep("success");
    document.getElementById("status").innerText = "Sound enabled. Ready for scan.";
  } catch (err) {
    alert("Sound cannot be enabled on this browser.");
  }
}
  function playBeep(type) {
  try {
    if (!soundEnabled) return;

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = sharedAudioCtx || new AudioContext();
    sharedAudioCtx = audioCtx;

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    if (type === "success") {
      oscillator.frequency.value = 880;
      gainNode.gain.value = 0.08;
    } else if (type === "duplicate") {
      oscillator.frequency.value = 440;
      gainNode.gain.value = 0.06;
    } else {
      oscillator.frequency.value = 220;
      gainNode.gain.value = 0.08;
    }

    oscillator.start();

    setTimeout(() => {
  oscillator.stop();
}, 120);
  } catch (err) {
    console.log("Sound not available:", err);
  }
}
  function showPopup() {
    const popup = document.getElementById("popup");
    popup.style.display = "block";
    setTimeout(() => popup.style.display = "none", 1800);
  }

  function releaseScanner(delay = 1200, message = "Ready for next student...") {
  setTimeout(() => {
    document.getElementById("status").innerText = message;
    scanBusy = false;
  }, delay);
}
  function warmUpLocation() {
    if (!navigator.geolocation) return;

    navigator.geolocation.getCurrentPosition(
      pos => {
        cachedLat = pos.coords.latitude;
        cachedLng = pos.coords.longitude;
      },
      () => {},
      {
        enableHighAccuracy: false,
        maximumAge: 300000,
        timeout: 1500
      }
    );
  }
function sendScanData(
  studentId,
  lat = "",
  lng = "",
  manualOverride = false
) {

  const scanType = getScanType();
  const session = getSession();
  const earlyOutReason = getEarlyOutReasonIfNeeded();


  // =====================================================
  // EARLY OUT CANCELLED
  // =====================================================

  if (earlyOutReason === null) {

    document.getElementById("status").innerText =
      "Early OUT cancelled. Select IN for arrival scan, or enter reason for Early OUT.";

    scanBusy = false;

    setTimeout(() => {
      document.getElementById("status").innerText =
        "Ready for next student...";
    }, 1200);

    return;
  }


  // =====================================================
  // PREPARE PAYLOAD
  // =====================================================

  const payload = {
    studentId: studentId,
    scanType: scanType,
    session: session,
    earlyOutReason: earlyOutReason,
    lat: lat,
    lng: lng,
    manualOverride: manualOverride
  };


  document.getElementById("status").innerText =
    "Sending scan for " + studentId + "...";


  // =====================================================
  // SEND TO APPS SCRIPT
  // =====================================================

  fetch(scriptURL, {
    method: "POST",
    body: new URLSearchParams(payload)
  })

    .then(resp => resp.json())

    .then(data => {

      const statusElement =
        document.getElementById("status");


      // ===================================================
      // SERVER BUSY
      // ===================================================

      if (data.busy) {

        playBeep("error");

        // No confirmed record was created.
        // Allow the same ID to be scanned again.
        lastScanned = "";
        lastScanKey = "";
        lastScanTime = 0;

        statusElement.innerText =
          data.error ||
          "Scanner is processing another attendance scan. Please scan again.";

        releaseScanner(
          1200,
          "Ready. Please scan the student again."
        );

        return;
      }


      // ===================================================
      // WRONG AM / PM SESSION
      // ===================================================

      if (data.sessionMismatch) {

        playBeep("error");

        statusElement.innerText =
          data.error ||
          "Wrong session selected. Please check AM or PM Session.";

        releaseScanner(
          2200,
          "Check the AM/PM Session, then scan again."
        );

        return;
      }


      // ===================================================
      // ATTENDANCE NOT REQUIRED
      // ===================================================

      if (data.attendanceNotRequired) {

        playBeep("error");

        const reason =
          data.skipReason ||
          "Attendance is not required today";

        statusElement.innerText =
          (data.studentName
            ? data.studentName + " - "
            : "") +
          reason +
          ". Scan not recorded.";

        releaseScanner(
          2500,
          "Ready for next student..."
        );

        return;
      }


      // ===================================================
      // DUPLICATE MOVEMENT
      // ===================================================

      if (
        data.success &&
        data.duplicate
      ) {

        playBeep("duplicate");

        statusElement.innerText =
          data.message ||
          "Duplicate scan ignored. No new attendance record was created.";

        releaseScanner(
          1400,
          "Ready for next student..."
        );

        return;
      }


      // ===================================================
      // OTHER BACKEND ERROR
      // ===================================================

      if (!data.success) {

        playBeep("error");

        statusElement.innerText =
          data.error ||
          "Scan failed. Please try again.";

        releaseScanner(
          2000,
          "Waiting for scan..."
        );

        return;
      }


      // ===================================================
      // SUCCESSFUL NEW ATTENDANCE RECORD
      // ===================================================

      playBeep("success");


      const logTable =
        document
          .getElementById("logTable")
          .querySelector("tbody");


      const directionText =
        data.direction ||
        data.scanType ||
        scanType ||
        "-";


      const statusText =
        data.status ||
        "-";


      const reasonText =
        data.reason ||
        data.earlyOutReason ||
        earlyOutReason ||
        "";


      const timeText =
        data.loggedAt ||
        data.time ||
        new Date().toLocaleTimeString();


      const studentName =
        data.studentName ||
        studentId;


      const normalizedDirection =
        String(directionText)
          .trim()
          .toLowerCase();


      const normalizedStatus =
        String(statusText)
          .trim()
          .toLowerCase();


      // ===================================================
      // FRIENDLY SUCCESS MESSAGE
      // ===================================================

      let successMessage =
        studentName +
        " - Scan recorded.";


      // PRESENT
      if (normalizedStatus === "present") {

        successMessage =
          studentName +
          " - PRESENT. Arrival recorded.";

      }


      // LATE ARRIVAL AFTER AUTOMATIC ABSENCE
      else if (
        normalizedDirection === "late arrival"
      ) {

        successMessage =
          studentName +
          " - LATE ARRIVAL recorded. Earlier absence corrected.";

      }


      // NORMAL LATE
      else if (
        normalizedStatus === "late"
      ) {

        successMessage =
          studentName +
          " - LATE. Arrival recorded.";

      }


      // RE-ENTRY
      else if (
        normalizedDirection === "re-entry" ||
        normalizedStatus === "re-entry"
      ) {

        successMessage =
          studentName +
          " - RE-ENTRY recorded.";

      }


      // EARLY OUT
      else if (
        normalizedStatus === "early out"
      ) {

        successMessage =
          studentName +
          " - EARLY OUT recorded" +
          (
            reasonText
              ? ": " + reasonText
              : ""
          ) +
          ".";

      }


      // GOING HOME
      else if (
        normalizedStatus === "going home"
      ) {

        successMessage =
          studentName +
          " - GOING HOME recorded.";

      }


      // ===================================================
      // SESSION INFORMATION
      // ===================================================

      if (
        data.sessionAdjusted &&
        data.session
      ) {

        successMessage +=
          " Session: " +
          data.session +
          ".";

      }


      statusElement.innerText =
        successMessage;


      // ===================================================
      // ADD TO LOCAL SCANNER TABLE
      // ===================================================

      const newRow =
        logTable.insertRow(0);


      newRow
        .insertCell(0)
        .textContent =
          data.studentName ||
          "Unknown";


      newRow
        .insertCell(1)
        .textContent =
          data.gradeLevel ||
          "-";


      newRow
        .insertCell(2)
        .textContent =
          data.section ||
          "-";


      newRow
        .insertCell(3)
        .textContent =
          String(directionText)
            .toUpperCase();


      newRow
        .insertCell(4)
        .textContent =
          statusText;


      newRow
        .insertCell(5)
        .textContent =
          reasonText;


      newRow
        .insertCell(6)
        .textContent =
          timeText;


      // Highlight Early Out.
      if (
        normalizedStatus === "early out"
      ) {

        newRow.style.backgroundColor =
          "#ede9fe";

      }


      showPopup();


      releaseScanner(
        1000,
        "Ready for next student..."
      );

    })


    // =====================================================
    // CONNECTION / FETCH ERROR
    // =====================================================

    .catch(err => {

      playBeep("error");

      console.error(
        "Fetch error:",
        err
      );


      // We cannot confirm that the scan completed.
      // Allow the same learner to scan again.
      lastScanned = "";
      lastScanKey = "";
      lastScanTime = 0;


      document
        .getElementById("status")
        .innerText =
          "Connection error. Scan was not confirmed.";


      releaseScanner(
        2000,
        "Ready. Please scan the student again."
      );

    });

}
  
  function startScanner() {
    if (scanning) return;
    scanning = true;

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    const cameraConfig = cameras.length
      ? { deviceId: { exact: cameras[currentCameraIndex].id } }
      : { facingMode: "environment" };

    html5QrCode.start(
      cameraConfig,
      {
        fps: 15,
        qrbox: { width: 250, height: 250 }
      },
      qrCodeMessage => {
        const now = Date.now();
        const scanKey = qrCodeMessage + "|" + getScanType() + "|" + getSession();

        if (scanBusy) return;

        if (scanKey === lastScanKey && now - lastScanTime < 3000) {
        playBeep("duplicate");
      
        document.getElementById("status").innerText =
          "Duplicate ignored. Move ID away, then scan next student.";
        
          setTimeout(() => {
            document.getElementById("status").innerText = "Ready for next student...";
          }, 1000);
        
          return;
        }

        scanBusy = true;
        lastScanned = qrCodeMessage;
        lastScanKey = scanKey;
        lastScanTime = now;

        sendScanData(qrCodeMessage, cachedLat, cachedLng);
      },
      () => {}
    ).catch(err => {
      console.log("Scanner start failed:", err);
      scanning = false;
      setTimeout(startScanner, 2000);
    });
  }

  function switchCamera() {

  const statusElement =
    document.getElementById("status");

  if (!cameras || cameras.length < 2) {

    statusElement.innerText =
      "Only one usable camera is available.";

    return;
  }


  if (scanBusy) {

    statusElement.innerText =
      "Please wait for the current scan to finish.";

    return;
  }


  const oldCameraIndex =
    currentCameraIndex;

  const nextCameraIndex =
    (currentCameraIndex + 1) %
    cameras.length;


  statusElement.innerText =
    "Switching camera...";


  const startSelectedCamera =
    cameraIndex => {

      currentCameraIndex =
        cameraIndex;

      scanning = false;


      return html5QrCode
        .start(
          {
            deviceId: {
              exact:
                cameras[currentCameraIndex].id
            }
          },
          {
            fps: 15,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          qrCodeMessage => {

            const now =
              Date.now();

            const scanKey =
              qrCodeMessage +
              "|" +
              getScanType() +
              "|" +
              getSession();


            if (scanBusy) {
              return;
            }


            if (
              scanKey === lastScanKey &&
              now - lastScanTime < 3000
            ) {

              playBeep("duplicate");

              statusElement.innerText =
                "Duplicate ignored. Move ID away, then scan next student.";

              setTimeout(() => {

                statusElement.innerText =
                  "Ready for next student...";

              }, 1000);

              return;
            }


            scanBusy = true;

            lastScanned =
              qrCodeMessage;

            lastScanKey =
              scanKey;

            lastScanTime =
              now;


            sendScanData(
              qrCodeMessage,
              cachedLat,
              cachedLng
            );

          },
          () => {}
        )
        .then(() => {

          scanning = true;
          scanBusy = false;

          statusElement.innerText =
            "Camera switched. Ready for scan.";

        });
    };


  // Stop current camera first.
  if (
    html5QrCode &&
    scanning
  ) {

    html5QrCode
      .stop()

      .then(() => {

        scanning = false;

        // Small delay gives Chrome time to release
        // the previous camera device.
        return new Promise(resolve =>
          setTimeout(resolve, 400)
        );

      })

      .then(() =>
        startSelectedCamera(
          nextCameraIndex
        )
      )

      .catch(error => {

        console.log(
          "Camera switch failed:",
          error
        );


        statusElement.innerText =
          "Selected camera is unavailable. Returning to previous camera...";


        // Try restoring the camera that worked.
        setTimeout(() => {

          startSelectedCamera(
            oldCameraIndex
          )
            .catch(restoreError => {

              console.log(
                "Camera restore failed:",
                restoreError
              );

              scanning = false;
              scanBusy = false;

              statusElement.innerText =
                "Camera unavailable. Close other camera apps or tabs, then refresh this page.";

            });

        }, 500);

      });

  } else {

    startSelectedCamera(
      nextCameraIndex
    )
      .catch(error => {

        console.log(
          "Camera start failed:",
          error
        );

        currentCameraIndex =
          oldCameraIndex;

        scanning = false;
        scanBusy = false;

        statusElement.innerText =
          "Unable to switch camera.";

      });

  }
}
  document.getElementById("manualBtn").addEventListener("click", () => {
    const id = document.getElementById("manualId").value.trim();

    if (id && !scanBusy) {
      scanBusy = true;
      sendScanData(id, cachedLat, cachedLng, true);
      document.getElementById("manualId").value = "";
    }
  });

  document.getElementById("switchCameraBtn").addEventListener("click", switchCamera);
  document.getElementById("enableSoundBtn").addEventListener("click", enableSound);

  warmUpLocation();

  Html5Qrcode.getCameras().then(devices => {
    cameras = devices || [];

    if (cameras.length > 0) {
      const backCameraIndex = cameras.findIndex(camera =>
        String(camera.label || "").toLowerCase().includes("back") ||
        String(camera.label || "").toLowerCase().includes("rear") ||
        String(camera.label || "").toLowerCase().includes("environment")
      );

      currentCameraIndex = backCameraIndex >= 0 ? backCameraIndex : 0;
    }

    startScanner();
  }).catch(err => {
    console.log("Camera list failed:", err);
    startScanner();
  });
</script>

</body>
</html>
